services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root1234
      MARIADB_DATABASE: test_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: mysql+asyncmy://root:root1234@db/test_db
      JWT_SECRET: change-me-in-production
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
